<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dfe2e5">
  <title>N.FC AI SUPERMARKET — Welcome to the Future</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #030303; font-family: Inter, Arial, sans-serif; }
    .showroom { --tilt-x: 0deg; --tilt-y: 0deg; --move-x: 0px; --move-y: 0px; position: relative; width: 100%; max-width: 1920px; margin: 0 auto; line-height: 0; overflow: hidden; isolation: isolate; perspective: 1400px; background: #030303; cursor: grab; touch-action: pan-y; }
    .showroom.is-dragging { cursor: grabbing; }
    .showroom::before { content: ""; position: absolute; z-index: 2; inset: 14px; border: 1px solid #ffffff58; border-radius: 3px; pointer-events: none; box-shadow: inset 0 0 60px #10182222, 0 0 0 1px #d7c49b22; }
    .premium-header { position: absolute; z-index: 4; top: clamp(2px, .35vw, 5px); left: clamp(30px, 4vw, 64px); right: clamp(30px, 4vw, 64px); display: flex; align-items: center; justify-content: space-between; line-height: 1; pointer-events: none; }
    .brand-lockup { display: flex; align-items: center; gap: 11px; padding: 6px 13px 6px 6px; border: 1px solid #ffffff46; border-radius: 999px; color: #f7f4ed; background: linear-gradient(125deg, #111a20c9, #252d30a8); box-shadow: 0 8px 24px #070b1077, inset 0 1px #ffffff24; backdrop-filter: blur(14px); text-shadow: 0 2px 15px #0008; }
    .brand-monogram { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid #e9dfc1b3; border-radius: 50%; color: #f2e3b9; font: 600 10px/1 Inter, Arial, sans-serif; letter-spacing: .08em; }
    .brand-copy { display: grid; gap: 5px; }
    .brand-name { font: 600 11px/1 Inter, Arial, sans-serif; letter-spacing: .2em; }
    .brand-caption { color: #f4f2edbb; font: 500 7px/1 Inter, Arial, sans-serif; letter-spacing: .19em; }
    .concierge-label { display: flex; align-items: center; gap: 8px; margin-left: auto; margin-right: 14px; color: #fffde7; font: 500 9px/1 Inter, Arial, sans-serif; letter-spacing: .16em; text-shadow: 0 2px 12px #000; }
    .concierge-dot { width: 5px; height: 5px; border-radius: 50%; background: #d8bd7d; box-shadow: 0 0 9px #e3c477; }

    .reference { display: block; width: 100%; height: auto; filter: none; transform: none; transform-origin: center; transition: none; will-change: transform; }
    .background-finish { position: absolute; z-index: 1; inset: 0; pointer-events: none; background: linear-gradient(180deg, #00000020 0%, #00000026 28%, #00000052 100%), radial-gradient(ellipse at 50% 50%, transparent 22%, #00000088 100%); mix-blend-mode: multiply; opacity: .98; }
    .welcome-copy { position: absolute; z-index: 3; left: 25.7%; top: 51.5%; width: 27.8%; height: 21.5%; display: flex; flex-direction: column; justify-content: center; gap: clamp(5px, .75vw, 10px); padding: 1.2% 1.45%; overflow: hidden; border: 1px solid #d8edf28f; border-radius: clamp(10px, 1.4vw, 20px); color: #fff; background: linear-gradient(118deg, #101720ed, #25333bdc 72%, #21313bcc); box-shadow: inset 0 1px #ffffff38, 0 10px 36px #08121c50, 0 0 20px #ffffff22; backdrop-filter: blur(14px); line-height: 1.2; pointer-events: none; }
    .welcome-title { font: 500 clamp(9px, 1.18vw, 17px)/1.32 Inter, Arial, sans-serif; letter-spacing: .005em; text-shadow: 0 1px 8px #080c10a3; }
    .welcome-title strong { display: block; margin-top: 1px; font-weight: 600; }
    .welcome-subtitle { color: #f4f7f9d9; font: 400 clamp(6px, .68vw, 9px)/1.45 Inter, Arial, sans-serif; letter-spacing: .01em; }
    .welcome-arrow { position: absolute; right: 7%; bottom: 18%; display: grid; place-items: center; width: clamp(17px, 2.15vw, 28px); aspect-ratio: 1; border: 1px solid #ffffffba; border-radius: 50%; color: #fff; font: 400 clamp(10px, 1.1vw, 15px)/1 Arial, sans-serif; box-shadow: 0 0 12px #ffffff55, inset 0 0 8px #ffffff33; }
    .depth-scene { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; transform: translate3d(var(--move-x), var(--move-y), 0) scale(1.075); transform-style: preserve-3d; transition: transform 250ms cubic-bezier(.2,.7,.2,1); }
    .orbit-stage { position: absolute; left: 50%; top: 73%; width: 43%; height: 27%; transform: translate(-50%, -50%); transform-style: preserve-3d; }
    .orbit { position: absolute; inset: 0; border: 1px solid #ffffff99; border-radius: 50%; box-shadow: 0 0 9px #ffffff66, inset 0 0 12px #ffffff33; transform-style: preserve-3d; }
    .orbit.one { animation: orbit-one 13s linear infinite; }
    .orbit.two { inset: 9% -7%; border-color: #fff9; animation: orbit-two 17s linear infinite; }
    .orbit.three { inset: 20% 12%; border-style: dashed; border-color: #ffffff88; animation: orbit-three 22s linear infinite; }
    .spark { position: absolute; width: clamp(4px, .55vw, 9px); aspect-ratio: 1; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px 3px #ffffff99, 0 0 22px 6px #ffffff66; animation: sparkle 2.8s ease-in-out infinite alternate; }
    .spark.a { left: 31%; top: 41%; animation-delay: -.7s; }
    .spark.b { left: 63%; top: 35%; animation-delay: -1.8s; }
    .spark.c { left: 72%; top: 56%; animation-delay: -.2s; }
    .spark.d { left: 39%; top: 62%; animation-delay: -2.1s; }
    .shelf-sweep { position: absolute; left: -22%; width: 18%; height: clamp(2px, .32vw, 5px); border-radius: 50%; background: linear-gradient(90deg, transparent, #ffffff88 35%, #fff 50%, #ffffff77 68%, transparent); box-shadow: 0 0 7px 1px #ffffff66; animation: shelf-glide 8s linear infinite; }
    .shelf-sweep.one { top: 29%; }
    .shelf-sweep.two { top: 40%; animation-delay: -2.7s; animation-duration: 9.5s; }
    .shelf-sweep.three { top: 51%; animation-delay: -5.2s; animation-duration: 10.5s; }
    @keyframes shelf-glide { from { transform: translateX(0) scaleX(.72); opacity: 0; } 12% { opacity: .85; } 82% { opacity: .65; } to { transform: translateX(800%) scaleX(1.15); opacity: 0; } }
    .animated-book { position: absolute; width: clamp(15px, 1.9vw, 28px); height: clamp(26px, 3.2vw, 45px); perspective: 500px; transform-style: preserve-3d; opacity: .72; filter: drop-shadow(1px 2px 3px #10182068); }
    .animated-book::before, .animated-book::after { content: ""; position: absolute; inset: 0; display: grid; place-items: center; border: 1px solid #d8f8ff; border-radius: 2px; backface-visibility: hidden; color: #fff; font: 800 clamp(5px, .55vw, 8px)/1 Inter, Arial, sans-serif; letter-spacing: .02em; text-shadow: 0 0 6px #60dfff; box-shadow: inset 0 0 8px #8ceaff44, 0 0 5px #68deff62; }
    .animated-book::before { content: "N.FC"; background: linear-gradient(145deg, #d9f9ffcc, #2b8bb7aa 35%, #082b58ee 100%); transform: translateZ(.7px); }
    .animated-book::after { content: "AI"; background: linear-gradient(145deg, #fff, #7dcce5 35%, #174a78); transform: rotateY(180deg) translateZ(.7px); }
    .animated-book.left-one { left: 7%; top: 29%; animation: book-turn 5.8s ease-in-out infinite; }
    .animated-book.left-two { left: 18%; top: 40%; animation: book-turn 7.1s ease-in-out -2s infinite; }
    .animated-book.left-three { left: 9%; top: 51%; animation: book-turn 6.4s ease-in-out -4s infinite; }
    .animated-book.right-one { left: 83%; top: 29%; animation: book-turn 6.3s ease-in-out -1s infinite; }
    .animated-book.right-two { left: 92%; top: 40%; animation: book-turn 7.6s ease-in-out -3.2s infinite; }
    .animated-book.right-three { left: 86%; top: 51%; animation: book-turn 5.5s ease-in-out -2.4s infinite; }
    @keyframes book-turn { 0%, 14% { transform: rotateY(0deg) translateZ(0); } 42% { transform: rotateY(180deg) translateZ(12px) scale(1.08); } 70%, 100% { transform: rotateY(360deg) translateZ(0); } }
    .cube-spot { --cube-size: clamp(46px, 6.2vw, 100px); position: absolute; left: 50%; top: 38%; width: var(--cube-size); height: var(--cube-size); transform: translate(-50%, -50%); perspective: 700px; }
    .holo-cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: cube-turn 11s linear infinite; }
    .cube-face { position: absolute; inset: 0; display: grid; place-items: center; border: 1px solid #ffffffcc; background: linear-gradient(145deg, #ffffff24, #ffffff18); color: #fff; box-shadow: inset 0 0 14px #ffffff55, 0 0 14px #ffffff44; font: 800 clamp(8px, 1vw, 14px)/1 Inter, Arial, sans-serif; letter-spacing: .04em; text-shadow: 0 0 7px #ffffff; backface-visibility: visible; }
    .cube-face.front { transform: translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.back { transform: rotateY(180deg) translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.right { transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.left { transform: rotateY(-90deg) translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.top { transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size) / 2)); }
    .palm-orb { --orb-size: clamp(25px, 3.8vw, 58px); position: absolute; left: 18.5%; top: 63%; width: var(--orb-size); aspect-ratio: 1; transform: translate(-50%, -50%); border: 1px solid #c4f8ff; border-radius: 50%; background: radial-gradient(circle at 32% 25%, #fff 0 4%, #eeeeee 8%, #bbbbbb 24%, #777777 48%, #333333 72%, #020c30 100%); box-shadow: inset -5px -7px 12px #020a3c9c, inset 4px 3px 9px #ffffffc2, 0 0 12px 4px #ffffff99, 0 0 33px 9px #ffffff66; animation: orb-hover 2.5s ease-in-out infinite alternate; }
    .palm-orb::before { content: ""; position: absolute; inset: -27% -46%; border: 1px solid #adf5ffdc; border-radius: 50%; transform: rotateX(68deg) rotateZ(-18deg); box-shadow: 0 0 7px #ffffff, inset 0 0 6px #55dcff66; animation: orb-ring 4s linear infinite; }
    .palm-orb::after { content: ""; position: absolute; top: 12%; left: 20%; width: 23%; height: 14%; border-radius: 50%; background: #fff; filter: blur(2px); opacity: .9; }
    @keyframes orb-hover { from { translate: 0 3px; scale: .96; } to { translate: 0 -4px; scale: 1.04; } }
    @keyframes orb-ring { from { rotate: 0deg; } to { rotate: 360deg; } }
    @keyframes cube-turn { from { transform: rotateX(-18deg) rotateY(0deg); } to { transform: rotateX(342deg) rotateY(360deg); } }
    @keyframes orbit-one { from { transform: rotateX(71deg) rotateZ(0deg); } to { transform: rotateX(71deg) rotateZ(360deg); } }
    @keyframes orbit-two { from { transform: rotateX(67deg) rotateY(18deg) rotateZ(360deg); } to { transform: rotateX(67deg) rotateY(18deg) rotateZ(0deg); } }
    @keyframes orbit-three { from { transform: rotateX(78deg) rotateY(-25deg) rotateZ(0deg); } to { transform: rotateX(78deg) rotateY(-25deg) rotateZ(360deg); } }
    @keyframes sparkle { from { opacity: .35; scale: .7; } to { opacity: 1; scale: 1.25; } }
    .showroom::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at var(--light-x, 50%) var(--light-y, 45%), #ffffff18, transparent 45%); mix-blend-mode: screen; }
    .energy-wave { position: absolute; z-index: 1; top: -35%; left: -24%; width: 14%; height: 170%; pointer-events: none; transform: skewX(-24deg); background: linear-gradient(90deg, transparent, #ffffff08 25%, #ffffff30 50%, #ffffff08 72%, transparent); filter: blur(6px); animation: energy-pass 15s ease-in-out infinite; }
    @keyframes energy-pass { 0%, 12% { left: -24%; opacity: 0; } 25% { opacity: .8; } 64% { opacity: .55; } 88%, 100% { left: 110%; opacity: 0; } }
    .showroom.is-speaking .palm-orb { animation-duration: 1.1s; filter: saturate(1.4) brightness(1.2); }
    .showroom.is-speaking .holo-cube { animation-duration: 3.8s; }
    .showroom.is-speaking .orbit { box-shadow: 0 0 15px #72dfffaa, inset 0 0 18px #72dfff77; }
    .sound-control { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; margin: 18px auto 26px; line-height: 1.35; pointer-events: auto; }
    .sound-button { border: 1px solid #e8ddbdad; border-radius: 999px; padding: 12px 17px; color: #fffdf5; background: linear-gradient(135deg, #17232be8, #11171be8); font: 600 9px/1 Inter, Arial, sans-serif; letter-spacing: .11em; text-transform: uppercase; cursor: pointer; pointer-events: auto; box-shadow: 0 8px 26px #070b10aa, inset 0 1px #ffffff22; backdrop-filter: blur(14px); transition: background 180ms ease, border-color 180ms ease, transform 180ms ease; }
    .sound-button:hover { background: linear-gradient(135deg, #26343beF, #161e23f2); border-color: #fff0c9; transform: translateY(-1px); }
    .sound-button:focus-visible { outline: 2px solid #e9d69e; outline-offset: 3px; }
    .voice-status { max-width: min(290px, 74vw); padding: 6px 9px; border-radius: 8px; color: #fff; background: #171a1dcc; font: 12px/1.4 Inter, Arial, sans-serif; text-align: right; }
    .voice-status:empty { display: none; }
    @media (max-width: 520px) {
      .reference, .depth-scene { transform: translate3d(var(--move-x), var(--move-y), 0) scale(1.035); }
      .welcome-copy { left: 25.2%; top: 51.5%; width: 29%; height: 21.5%; gap: 4px; padding: 1.4% 1.6%; border-radius: 9px; }
      .welcome-title { font-size: clamp(8px, 2.15vw, 11px); }
      .welcome-subtitle { font-size: clamp(5px, 1.25vw, 7px); }
      .welcome-arrow { width: clamp(15px, 3.6vw, 19px); right: 5%; bottom: 13%; font-size: 10px; }
      .orbit-stage { width: 52%; height: 27%; top: 73%; }
      .animated-book { width: clamp(13px, 4vw, 20px); height: clamp(23px, 6vw, 34px); }
      .animated-book.left-two { left: 22%; }
      .animated-book.right-two { left: 91%; }
      .cube-spot { --cube-size: clamp(42px, 9vw, 64px); top: 38%; }
      .palm-orb { --orb-size: clamp(25px, 7vw, 40px); }
      .showroom::before { inset: 7px; }
      .premium-header { top: 4px; left: 18px; right: 18px; }
      .brand-monogram { width: 30px; height: 30px; font-size: 8px; }
      .brand-lockup { gap: 8px; }
      .brand-name { font-size: 9px; }
      .brand-caption { font-size: 6px; }
      .concierge-label { display: none; }
      .sound-control { top: 10px; right: 18px; gap: 4px; }
      .sound-button { padding: 10px 12px; font-size: 8px; }
      .voice-status { max-width: 68vw; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { .reference, .depth-scene { transition: none; } .energy-wave, .orbit, .spark, .holo-cube, .shelf-sweep, .animated-book, .palm-orb, .palm-orb::before { animation: none !important; } }
      /* Match the supplied reference artwork exactly: preserve its original color and built-in composition. */
    .background-finish, .welcome-copy, .energy-wave, .depth-scene, .premium-header, .showroom::after { display: none !important; }

    .showroom { line-height: normal; }
    .sound-control { top: auto !important; right: auto !important; }
    .reference { filter: none !important; transform: none !important; opacity: 1 !important; }

    /* Ambient data-centre motion only — no added globe or replacement objects. */
    .data-centre-motion { position:absolute; z-index:1; inset:0; pointer-events:none; overflow:hidden; }
    .data-centre-motion::before { content:""; position:absolute; inset:0; opacity:.28; mix-blend-mode:screen; background:
      linear-gradient(105deg, transparent 0 9%, #29d8ff00 13%, #49eaff22 16%, transparent 19% 35%, #2bdcff00 39%, #64f1ff1c 43%, transparent 47% 72%, #29d8ff00 76%, #49eaff22 80%, transparent 84%),
      radial-gradient(ellipse at 8% 45%, #21cfff22 0%, transparent 25%),
      radial-gradient(ellipse at 92% 42%, #21cfff22 0%, transparent 25%);
      animation: data-centre-lightflow 11s ease-in-out infinite alternate; }
    .data-centre-motion::after { content:""; position:absolute; left:0; right:0; top:-28%; height:14%; opacity:0; background:linear-gradient(180deg, transparent, #63eaff0b 35%, #70efff40 50%, #63eaff0b 65%, transparent); filter:blur(3px); mix-blend-mode:screen; animation: data-centre-scan 13s linear infinite; }
    .data-centre-motion .rack-light { position:absolute; top:8%; bottom:24%; width:2px; opacity:0; background:linear-gradient(180deg, transparent, #48e4ff99 20%, #b6f8ff 50%, #39d7ff88 80%, transparent); box-shadow:0 0 7px 2px #28cfff55; }
    .data-centre-motion .rack-light.left { left:5.5%; animation: rack-status 5.2s ease-in-out infinite; }
    .data-centre-motion .rack-light.right { right:5.5%; animation: rack-status 6.3s ease-in-out -2.4s infinite; }
    @keyframes data-centre-lightflow { 0% { transform:translateX(-1%) scale(1); opacity:.12; } 45% { opacity:.32; } 100% { transform:translateX(1%) scale(1.015); opacity:.2; } }
    @keyframes data-centre-scan { 0% { top:-28%; opacity:0; } 12% { opacity:.65; } 88% { opacity:.35; } 100% { top:110%; opacity:0; } }
    @keyframes rack-status { 0%,100% { opacity:0; } 18% { opacity:.22; } 33% { opacity:.06; } 51% { opacity:.42; } 68% { opacity:.12; } }
    @media (prefers-reduced-motion:reduce) { .data-centre-motion::before, .data-centre-motion::after, .data-centre-motion .rack-light { animation:none !important; } }

    .showroom { line-height: normal; }
    .sound-control { top: auto !important; right: auto !important; }
    .reference { filter: none !important; transform: none !important; opacity: 1 !important; }
  </style>
</head>
<body>
  <main class="showroom" aria-label="N.FC AI SUPERMARKET showroom">
    <header class="premium-header" aria-label="N.FC AI SUPERMARKET">
      <div class="brand-lockup"><span class="brand-monogram">N.FC</span><span class="brand-copy"><span class="brand-name">N.FC AI SUPERMARKET</span><span class="brand-caption">A MORE INTELLIGENT WAY TO EXPLORE</span></span></div>
    </header>
    <img class="reference" src="/assets/B4AC8926-2898-4B33-9BD0-46CF56A3038D.png" alt="N.FC AI SUPERMARKET futuristic silver showroom with a female AI greeter named Natha, a welcome panel, product shelves, and a circular platform">
    <div class="data-centre-motion" aria-hidden="true"><i class="rack-light left"></i><i class="rack-light right"></i></div>
    <div class="background-finish" aria-hidden="true"></div>
    <div class="welcome-copy" aria-label="My name is Natha. Welcome to N.FC AI SUPERMARKET. Your AI-powered digital product store. Discover, explore, and upgrade your potential.">
      <div class="welcome-title">My name is Natha,<strong>welcome to N.FC AI SUPERMARKET.</strong></div>
      <div class="welcome-subtitle">Your AI-powered digital product store.<br>Discover, explore, and upgrade your potential.</div>
      <span class="welcome-arrow" aria-hidden="true">→</span>
    </div>
    <div class="energy-wave" aria-hidden="true"></div>
    <div class="depth-scene" aria-hidden="true">
      <div class="cube-spot"><div class="holo-cube"><span class="cube-face front">N.FC</span><span class="cube-face back">N.FC</span><span class="cube-face right">AI</span><span class="cube-face left">AI</span><span class="cube-face top">✦</span><span class="cube-face bottom">✦</span></div></div>
      <div class="palm-orb"></div>
      <i class="animated-book left-one"></i><i class="animated-book left-two"></i><i class="animated-book left-three"></i>
      <i class="animated-book right-one"></i><i class="animated-book right-two"></i><i class="animated-book right-three"></i>
      <i class="shelf-sweep one"></i><i class="shelf-sweep two"></i><i class="shelf-sweep three"></i>
      <div class="orbit-stage"><span class="orbit one"></span><span class="orbit two"></span><span class="orbit three"></span></div>
      <i class="spark a"></i><i class="spark b"></i><i class="spark c"></i><i class="spark d"></i>
    </div>
    <div class="sound-control">
      <button class="sound-button" id="nathaSound" type="button" aria-label="Play Natha's welcome greeting">Meet Natha  ·  Hear welcome</button>
      <span class="voice-status" id="voiceStatus" role="status" aria-live="polite"></span>
    </div>
  </main>
  <script>
    const soundButton = document.getElementById('nathaSound');
    const voiceStatus = document.getElementById('voiceStatus');
    const greeting = 'My name is Natha! Welcome to N.FC AI SUPERMARKET. I am so happy you are here!';
    const showroom = document.querySelector('.showroom');
    const feminineVoiceNames = /\b(samantha|ava|aria|jenny|zira|susan|karen|moira|tessa|victoria|serena|allison|siri female|google us english)\b/i;

    function chooseEnglishVoice() {
      const voices = window.speechSynthesis.getVoices();
      const englishVoices = voices.filter((voice) => /^en([_-]|$)/i.test(voice.lang));
      const feminine = englishVoices.find((voice) => feminineVoiceNames.test(`${voice.name} ${voice.voiceURI}`));
      return { voice: feminine || englishVoices[0] || null, clearlyFeminineByName: Boolean(feminine) };
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.addEventListener('voiceschanged', chooseEnglishVoice);
    }

    soundButton.addEventListener('click', () => {
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        voiceStatus.textContent = 'Speech is not supported by this browser.';
        return;
      }

      window.speechSynthesis.cancel();
      const selection = chooseEnglishVoice();
      const utterance = new SpeechSynthesisUtterance(greeting);
      if (selection.voice) utterance.voice = selection.voice;
      utterance.lang = selection.voice?.lang || 'en-US';
      utterance.rate = 0.9;
      utterance.pitch = 1.34;
      utterance.volume = 1;

      if (selection.clearlyFeminineByName) {
        voiceStatus.textContent = `Using ${selection.voice.name} (${selection.voice.lang}) with a brighter, higher pitch. Voice character is provided by your browser or system.`;
      } else if (selection.voice) {
        voiceStatus.textContent = `No clearly feminine English voice was identifiable by name. Using ${selection.voice.name} (${selection.voice.lang}); its voice character depends on your browser or system.`;
      } else {
        voiceStatus.textContent = 'No English voice is listed yet. Trying the browser default; voice character depends on your browser or system.';
      }

      utterance.onstart = () => { soundButton.textContent = 'Natha is speaking…'; showroom.classList.add('is-speaking'); };
      utterance.onend = () => { soundButton.textContent = 'Meet Natha  ·  Hear welcome'; showroom.classList.remove('is-speaking'); };
      utterance.onerror = () => {
        soundButton.textContent = 'Meet Natha  ·  Hear welcome';
        showroom.classList.remove('is-speaking');
        voiceStatus.textContent = 'The browser could not play speech. Check its available voices and audio settings.';
      };
      window.speechSynthesis.speak(utterance);
    });

    let greetedOnFirstClick = false;
    showroom.addEventListener('click', (event) => {
      if (greetedOnFirstClick || event.target.closest('#nathaSound')) return;
      greetedOnFirstClick = true;
      soundButton.click();
    });

    let dragPanX = 0;
    let dragPanY = 0;
    let hoverPanX = 0;
    let hoverPanY = 0;
    let activePointer = null;
    let lastX = 0;
    let lastY = 0;
    let dragDistance = 0;
    let suppressNextClick = false;
    const finePointer = window.matchMedia('(pointer: fine)').matches;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function updateScenePosition() {
      showroom.style.setProperty('--move-x', `${dragPanX + hoverPanX}px`);
      showroom.style.setProperty('--move-y', `${dragPanY + hoverPanY}px`);
    }

    showroom.addEventListener('pointerdown', (event) => {
      if (event.target.closest('button, a') || (event.pointerType === 'mouse' && event.button !== 0)) return;
      activePointer = event.pointerId;
      lastX = event.clientX;
      lastY = event.clientY;
      dragDistance = 0;
      showroom.classList.add('is-dragging');
      showroom.setPointerCapture(event.pointerId);
    });

    showroom.addEventListener('pointermove', (event) => {
      const bounds = showroom.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width;
      const y = (event.clientY - bounds.top) / bounds.height;
      if (activePointer === event.pointerId) {
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        dragDistance += Math.abs(dx) + Math.abs(dy);
        if (dragDistance > 7) suppressNextClick = true;
        dragPanX = Math.max(-24, Math.min(24, dragPanX + dx));
        dragPanY = Math.max(-16, Math.min(16, dragPanY + dy));
        lastX = event.clientX;
        lastY = event.clientY;
        hoverPanX = 0;
        hoverPanY = 0;
        updateScenePosition();
      } else if (finePointer && !reducedMotion) {
        hoverPanX = (0.5 - x) * 5;
        hoverPanY = (0.5 - y) * 4;
        updateScenePosition();
      }
      showroom.style.setProperty('--light-x', `${x * 100}%`);
      showroom.style.setProperty('--light-y', `${y * 100}%`);
    });

    showroom.addEventListener('pointerup', (event) => {
      if (activePointer !== event.pointerId) return;
      activePointer = null;
      showroom.classList.remove('is-dragging');
      if (suppressNextClick) setTimeout(() => { suppressNextClick = false; }, 0);
    });

    showroom.addEventListener('pointercancel', () => {
      activePointer = null;
      showroom.classList.remove('is-dragging');
      suppressNextClick = false;
    });

    showroom.addEventListener('pointerleave', () => {
      if (activePointer !== null) return;
      hoverPanX = 0;
      hoverPanY = 0;
      updateScenePosition();
      showroom.style.setProperty('--light-x', '50%');
      showroom.style.setProperty('--light-y', '45%');
    });

    showroom.addEventListener('click', (event) => {
      if (!suppressNextClick) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      suppressNextClick = false;
    }, true);
  </script>
</body>
</html>
