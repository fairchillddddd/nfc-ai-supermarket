<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dfe2e5">
  <title>N.FC AI SUPERMARKET — Welcome to the Future</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #11151a; font-family: Inter, Arial, sans-serif; }
    .showroom { --tilt-x: 0deg; --tilt-y: 0deg; --move-x: 0px; --move-y: 0px; position: relative; width: 100%; max-width: 1920px; margin: 0 auto; line-height: 0; overflow: hidden; isolation: isolate; perspective: 1400px; background: #11151a; cursor: grab; touch-action: pan-y; }
    .showroom.is-dragging { cursor: grabbing; }
    .reference { display: block; width: 100%; height: auto; transform: translate3d(var(--move-x), var(--move-y), 0) scale(1.075); transform-origin: center; transition: transform 250ms cubic-bezier(.2,.7,.2,1), filter 700ms ease; will-change: transform; }
    .depth-scene { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; transform: translate3d(var(--move-x), var(--move-y), 0) scale(1.075); transform-style: preserve-3d; transition: transform 250ms cubic-bezier(.2,.7,.2,1); }
    .orbit-stage { position: absolute; left: 50%; top: 73%; width: 43%; height: 27%; transform: translate(-50%, -50%); transform-style: preserve-3d; }
    .orbit { position: absolute; inset: 0; border: 1px solid #a2efff99; border-radius: 50%; box-shadow: 0 0 9px #72dfff66, inset 0 0 12px #72dfff44; transform-style: preserve-3d; }
    .orbit.one { animation: orbit-one 13s linear infinite; }
    .orbit.two { inset: 9% -7%; border-color: #fff9; animation: orbit-two 17s linear infinite; }
    .orbit.three { inset: 20% 12%; border-style: dashed; border-color: #91cfffaa; animation: orbit-three 22s linear infinite; }
    .spark { position: absolute; width: clamp(4px, .55vw, 9px); aspect-ratio: 1; border-radius: 50%; background: #e6fbff; box-shadow: 0 0 8px 3px #73dbffb3, 0 0 22px 6px #67caff66; animation: sparkle 2.8s ease-in-out infinite alternate; }
    .spark.a { left: 31%; top: 41%; animation-delay: -.7s; }
    .spark.b { left: 63%; top: 35%; animation-delay: -1.8s; }
    .spark.c { left: 72%; top: 56%; animation-delay: -.2s; }
    .spark.d { left: 39%; top: 62%; animation-delay: -2.1s; }
    .shelf-sweep { position: absolute; left: -22%; width: 18%; height: clamp(2px, .32vw, 5px); border-radius: 50%; background: linear-gradient(90deg, transparent, #b8f7ffb3 35%, #fff 50%, #7de2ffb3 68%, transparent); box-shadow: 0 0 10px 2px #69d9ff99; animation: shelf-glide 8s linear infinite; }
    .shelf-sweep.one { top: 29%; }
    .shelf-sweep.two { top: 40%; animation-delay: -2.7s; animation-duration: 9.5s; }
    .shelf-sweep.three { top: 51%; animation-delay: -5.2s; animation-duration: 10.5s; }
    @keyframes shelf-glide { from { transform: translateX(0) scaleX(.72); opacity: 0; } 12% { opacity: .85; } 82% { opacity: .65; } to { transform: translateX(800%) scaleX(1.15); opacity: 0; } }
    .animated-book { position: absolute; width: clamp(19px, 2.5vw, 36px); height: clamp(31px, 4.3vw, 60px); perspective: 500px; transform-style: preserve-3d; filter: drop-shadow(2px 4px 4px #10182088); }
    .animated-book::before, .animated-book::after { content: ""; position: absolute; inset: 0; display: grid; place-items: center; border: 1px solid #d8f8ff; border-radius: 2px; backface-visibility: hidden; color: #fff; font: 800 clamp(5px, .55vw, 8px)/1 Inter, Arial, sans-serif; letter-spacing: .02em; text-shadow: 0 0 6px #60dfff; box-shadow: inset 0 0 12px #8ceaff66, 0 0 8px #68deff88; }
    .animated-book::before { content: "N.FC"; background: linear-gradient(145deg, #d9f9ffcc, #2b8bb7aa 35%, #082b58ee 100%); transform: translateZ(.7px); }
    .animated-book::after { content: "AI"; background: linear-gradient(145deg, #fff, #7dcce5 35%, #174a78); transform: rotateY(180deg) translateZ(.7px); }
    .animated-book.left-one { left: 7%; top: 29%; animation: book-turn 5.8s ease-in-out infinite; }
    .animated-book.left-two { left: 18%; top: 40%; animation: book-turn 7.1s ease-in-out -2s infinite; }
    .animated-book.left-three { left: 9%; top: 51%; animation: book-turn 6.4s ease-in-out -4s infinite; }
    .animated-book.right-one { left: 83%; top: 29%; animation: book-turn 6.3s ease-in-out -1s infinite; }
    .animated-book.right-two { left: 92%; top: 40%; animation: book-turn 7.6s ease-in-out -3.2s infinite; }
    .animated-book.right-three { left: 86%; top: 51%; animation: book-turn 5.5s ease-in-out -2.4s infinite; }
    @keyframes book-turn { 0%, 14% { transform: rotateY(0deg) translateZ(0); } 42% { transform: rotateY(180deg) translateZ(12px) scale(1.08); } 70%, 100% { transform: rotateY(360deg) translateZ(0); } }
    .cube-spot { --cube-size: clamp(46px, 6.2vw, 100px); position: absolute; left: 50%; top: 38%; width: var(--cube-size); height: var(--cube-size); transform: translate(-50%, -50%); perspective: 700px; }
    .holo-cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: cube-turn 11s linear infinite; }
    .cube-face { position: absolute; inset: 0; display: grid; place-items: center; border: 1px solid #c8f5ffcc; background: linear-gradient(145deg, #c5f6ff3d, #5bbbe32b); color: #fff; box-shadow: inset 0 0 14px #7ce7ff66, 0 0 14px #7ce7ff55; font: 800 clamp(8px, 1vw, 14px)/1 Inter, Arial, sans-serif; letter-spacing: .04em; text-shadow: 0 0 7px #49d9ff; backface-visibility: visible; }
    .cube-face.front { transform: translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.back { transform: rotateY(180deg) translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.right { transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.left { transform: rotateY(-90deg) translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.top { transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2)); }
    .cube-face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size) / 2)); }
    .palm-orb { --orb-size: clamp(25px, 3.8vw, 58px); position: absolute; left: 18.5%; top: 63%; width: var(--orb-size); aspect-ratio: 1; transform: translate(-50%, -50%); border: 1px solid #c4f8ff; border-radius: 50%; background: radial-gradient(circle at 32% 25%, #fff 0 4%, #b4fbff 8%, #36bfff 24%, #087ce0 48%, #102b78 72%, #020c30 100%); box-shadow: inset -5px -7px 12px #020a3c9c, inset 4px 3px 9px #ffffffc2, 0 0 12px 4px #46d5ffb3, 0 0 33px 9px #148eff8c; animation: orb-hover 2.5s ease-in-out infinite alternate; }
    .palm-orb::before { content: ""; position: absolute; inset: -27% -46%; border: 1px solid #adf5ffdc; border-radius: 50%; transform: rotateX(68deg) rotateZ(-18deg); box-shadow: 0 0 7px #55dcff, inset 0 0 6px #55dcff66; animation: orb-ring 4s linear infinite; }
    .palm-orb::after { content: ""; position: absolute; top: 12%; left: 20%; width: 23%; height: 14%; border-radius: 50%; background: #fff; filter: blur(2px); opacity: .9; }
    @keyframes orb-hover { from { translate: 0 3px; scale: .96; } to { translate: 0 -4px; scale: 1.04; } }
    @keyframes orb-ring { from { rotate: 0deg; } to { rotate: 360deg; } }
    @keyframes cube-turn { from { transform: rotateX(-18deg) rotateY(0deg); } to { transform: rotateX(342deg) rotateY(360deg); } }
    @keyframes orbit-one { from { transform: rotateX(71deg) rotateZ(0deg); } to { transform: rotateX(71deg) rotateZ(360deg); } }
    @keyframes orbit-two { from { transform: rotateX(67deg) rotateY(18deg) rotateZ(360deg); } to { transform: rotateX(67deg) rotateY(18deg) rotateZ(0deg); } }
    @keyframes orbit-three { from { transform: rotateX(78deg) rotateY(-25deg) rotateZ(0deg); } to { transform: rotateX(78deg) rotateY(-25deg) rotateZ(360deg); } }
    @keyframes sparkle { from { opacity: .35; scale: .7; } to { opacity: 1; scale: 1.25; } }
    .showroom::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at var(--light-x, 50%) var(--light-y, 45%), #d9f5ff2b, transparent 45%); mix-blend-mode: screen; }
    .sound-control { position: absolute; right: clamp(10px, 2.4vw, 36px); bottom: clamp(12px, 3vw, 42px); z-index: 1; display: grid; justify-items: end; gap: 7px; line-height: 1.35; }
    .sound-button { border: 1px solid #fff; border-radius: 999px; padding: 11px 16px; color: #fff; background: #171a1de8; font: 600 13px/1.2 Inter, Arial, sans-serif; cursor: pointer; box-shadow: 0 5px 20px #1115; }
    .sound-button:hover { background: #343a40; }
    .sound-button:focus-visible { outline: 3px solid #7dcaff; outline-offset: 3px; }
    .voice-status { max-width: min(290px, 74vw); padding: 6px 9px; border-radius: 8px; color: #fff; background: #171a1dcc; font: 12px/1.4 Inter, Arial, sans-serif; text-align: right; }
    .voice-status:empty { display: none; }
    @media (max-width: 520px) {
      .reference, .depth-scene { transform: translate3d(var(--move-x), var(--move-y), 0) scale(1.035); }
      .orbit-stage { width: 52%; height: 27%; top: 73%; }
      .animated-book { width: clamp(16px, 5vw, 24px); height: clamp(25px, 7vw, 38px); }
      .animated-book.left-two { left: 22%; }
      .animated-book.right-two { left: 91%; }
      .cube-spot { --cube-size: clamp(42px, 9vw, 64px); top: 38%; }
      .palm-orb { --orb-size: clamp(25px, 7vw, 40px); }
      .sound-control { right: 8px; bottom: 8px; gap: 4px; }
      .sound-button { padding: 8px 11px; font-size: 11px; }
      .voice-status { max-width: 68vw; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { .reference, .depth-scene { transition: none; } .orbit, .spark, .holo-cube, .shelf-sweep, .animated-book, .palm-orb, .palm-orb::before { animation: none !important; } }
  </style>
</head>
<body>
  <main class="showroom" aria-label="N.FC AI SUPERMARKET showroom">
    <img class="reference" src="/assets/natha-showroom-reference.jpg" alt="N.FC AI SUPERMARKET futuristic silver showroom with a female AI greeter named Natha, a welcome panel, product shelves, and a circular platform">
    <div class="depth-scene" aria-hidden="true">
      <div class="cube-spot"><div class="holo-cube"><span class="cube-face front">N.FC</span><span class="cube-face back">N.FC</span><span class="cube-face right">AI</span><span class="cube-face left">AI</span><span class="cube-face top">✦</span><span class="cube-face bottom">✦</span></div></div>
      <div class="palm-orb"></div>
      <i class="animated-book left-one"></i><i class="animated-book left-two"></i><i class="animated-book left-three"></i>
      <i class="animated-book right-one"></i><i class="animated-book right-two"></i><i class="animated-book right-three"></i>
      <i class="shelf-sweep one"></i><i class="shelf-sweep two"></i><i class="shelf-sweep three"></i>
      <div class="orbit-stage"><span class="orbit one"></span><span class="orbit two"></span><span class="orbit three"></span></div>
      <i class="spark a"></i><i class="spark b"></i><i class="spark c"></i><i class="spark d"></i>
    </div>
    <div class="sound-control">
      <button class="sound-button" id="nathaSound" type="button" aria-label="Play Natha's welcome greeting">▶ Hear Natha welcome</button>
      <span class="voice-status" id="voiceStatus" role="status" aria-live="polite"></span>
    </div>
  </main>
  <script>
    const soundButton = document.getElementById('nathaSound');
    const voiceStatus = document.getElementById('voiceStatus');
    const greeting = 'My name is Natha! Welcome to N.FC AI SUPERMARKET. I am so happy you are here!';
    const showroom = document.querySelector('.showroom');
    const feminineVoiceNames = /\b(samantha|ava|aria|jenny|zira|susan|karen|moira|tessa|victoria|serena|allison|siri female|google us english)\b/i;

    function chooseEnglishVoice() {
      const voices = window.speechSynthesis.getVoices();
      const englishVoices = voices.filter((voice) => /^en([_-]|$)/i.test(voice.lang));
      const feminine = englishVoices.find((voice) => feminineVoiceNames.test(`${voice.name} ${voice.voiceURI}`));
      return { voice: feminine || englishVoices[0] || null, clearlyFeminineByName: Boolean(feminine) };
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.addEventListener('voiceschanged', chooseEnglishVoice);
    }

    soundButton.addEventListener('click', () => {
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        voiceStatus.textContent = 'Speech is not supported by this browser.';
        return;
      }

      window.speechSynthesis.cancel();
      const selection = chooseEnglishVoice();
      const utterance = new SpeechSynthesisUtterance(greeting);
      if (selection.voice) utterance.voice = selection.voice;
      utterance.lang = selection.voice?.lang || 'en-US';
      utterance.rate = 0.9;
      utterance.pitch = 1.34;
      utterance.volume = 1;

      if (selection.clearlyFeminineByName) {
        voiceStatus.textContent = `Using ${selection.voice.name} (${selection.voice.lang}) with a brighter, higher pitch. Voice character is provided by your browser or system.`;
      } else if (selection.voice) {
        voiceStatus.textContent = `No clearly feminine English voice was identifiable by name. Using ${selection.voice.name} (${selection.voice.lang}); its voice character depends on your browser or system.`;
      } else {
        voiceStatus.textContent = 'No English voice is listed yet. Trying the browser default; voice character depends on your browser or system.';
      }

      utterance.onstart = () => { soundButton.textContent = '♪ Natha is speaking…'; };
      utterance.onend = () => { soundButton.textContent = '▶ Hear Natha welcome'; };
      utterance.onerror = () => {
        soundButton.textContent = '▶ Hear Natha welcome';
        voiceStatus.textContent = 'The browser could not play speech. Check its available voices and audio settings.';
      };
      window.speechSynthesis.speak(utterance);
    });

    let greetedOnFirstClick = false;
    showroom.addEventListener('click', (event) => {
      if (greetedOnFirstClick || event.target.closest('#nathaSound')) return;
      greetedOnFirstClick = true;
      soundButton.click();
    });

    let dragPanX = 0;
    let dragPanY = 0;
    let hoverPanX = 0;
    let hoverPanY = 0;
    let activePointer = null;
    let lastX = 0;
    let lastY = 0;
    let dragDistance = 0;
    let suppressNextClick = false;
    const finePointer = window.matchMedia('(pointer: fine)').matches;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function updateScenePosition() {
      showroom.style.setProperty('--move-x', `${dragPanX + hoverPanX}px`);
      showroom.style.setProperty('--move-y', `${dragPanY + hoverPanY}px`);
    }

    showroom.addEventListener('pointerdown', (event) => {
      if (event.target.closest('button, a') || (event.pointerType === 'mouse' && event.button !== 0)) return;
      activePointer = event.pointerId;
      lastX = event.clientX;
      lastY = event.clientY;
      dragDistance = 0;
      showroom.classList.add('is-dragging');
      showroom.setPointerCapture(event.pointerId);
    });

    showroom.addEventListener('pointermove', (event) => {
      const bounds = showroom.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width;
      const y = (event.clientY - bounds.top) / bounds.height;
      if (activePointer === event.pointerId) {
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        dragDistance += Math.abs(dx) + Math.abs(dy);
        if (dragDistance > 7) suppressNextClick = true;
        dragPanX = Math.max(-24, Math.min(24, dragPanX + dx));
        dragPanY = Math.max(-16, Math.min(16, dragPanY + dy));
        lastX = event.clientX;
        lastY = event.clientY;
        hoverPanX = 0;
        hoverPanY = 0;
        updateScenePosition();
      } else if (finePointer && !reducedMotion) {
        hoverPanX = (0.5 - x) * 5;
        hoverPanY = (0.5 - y) * 4;
        updateScenePosition();
      }
      showroom.style.setProperty('--light-x', `${x * 100}%`);
      showroom.style.setProperty('--light-y', `${y * 100}%`);
    });

    showroom.addEventListener('pointerup', (event) => {
      if (activePointer !== event.pointerId) return;
      activePointer = null;
      showroom.classList.remove('is-dragging');
      if (suppressNextClick) setTimeout(() => { suppressNextClick = false; }, 0);
    });

    showroom.addEventListener('pointercancel', () => {
      activePointer = null;
      showroom.classList.remove('is-dragging');
      suppressNextClick = false;
    });

    showroom.addEventListener('pointerleave', () => {
      if (activePointer !== null) return;
      hoverPanX = 0;
      hoverPanY = 0;
      updateScenePosition();
      showroom.style.setProperty('--light-x', '50%');
      showroom.style.setProperty('--light-y', '45%');
    });

    showroom.addEventListener('click', (event) => {
      if (!suppressNextClick) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      suppressNextClick = false;
    }, true);
  </script>
</body>
</html>
